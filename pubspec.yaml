name: yust_open_file_x
description: A Univelop fork of open_filex that adds iOS 26 default-app support (useIosDefaultApp flag). Opens files via the native app on iOS/Android/desktop/web.
version: 4.7.1
homepage: https://github.com/univelop/open_filex
repository: https://github.com/univelop/open_filex

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.0.1

dev_dependencies:
  flutter_lints: ^2.0.1

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: ">=3.0.0"

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        package: com.crazecoder.openfile
        pluginClass: OpenFilePlugin
      ios:
        pluginClass: OpenFilePlugin
